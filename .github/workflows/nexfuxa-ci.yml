name: NexFuxa CI

on:
  pull_request:
    branches: [nexfuxa]
  push:
    branches: [nexfuxa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plc-model-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Phase 3A and 3B regression tests
        run: node --test tools/plc-device-model/test/phase3a.test.cjs tools/plc-device-model/test/phase3b.test.cjs

  server-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsqlite3-dev
      - name: Install server dependencies
        run: npm ci
      - name: Server tests
        run: npm test
      - name: Server build
        run: npm run build

  client-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Client script tests
        run: npm run test:scripts
      - name: Phase 3B client race tests
        run: node --test test/plc-device-models-race.test.cjs
      - name: Angular production build
        run: npm run build -- --configuration production
