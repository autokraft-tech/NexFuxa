name: NexFuxa CI

on:
  pull_request:
    branches: [nexfuxa]
  push:
    branches: [nexfuxa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plc-model-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Phase 3A, 3B and 3B.1 regression tests
        run: node --test tools/plc-device-model/test/phase3a.test.cjs tools/plc-device-model/test/phase3b.test.cjs tools/plc-device-model/test/phase3b1.test.cjs tools/plc-device-model/test/phase3b1-manager.test.cjs

  server-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsqlite3-dev
      - name: Install server dependencies
        run: npm ci
      - name: Server tests
        run: npm test
      - name: Server build
        run: npm run build

  client-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Client script tests
        run: npm run test:scripts
      - name: Phase 3B client race tests
        run: node --test test/plc-device-models-race.test.cjs
      - name: Angular production build
        run: npm run build -- --configuration production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated UI test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential python3 libsqlite3-dev
          npm ci --prefix ../server
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Actual Angular Dialog and API regression
        run: python test/plc-generator-e2e.py
      - name: Widget prefix binding and SQLite restart regression
        run: npm run test:widget-binding
      - name: Widget prefix binding browser regression
        env:
          TMPDIR: ${{ runner.temp }}
        run: python test/widget-prefix-e2e.py
      - name: View instance isolation unit regression
        run: node --test test/view-instance.test.cjs
      - name: View instance isolation browser regression
        env:
          TMPDIR: ${{ runner.temp }}
        run: python test/view-instance-e2e.py
      - name: Faceplate inheritance unit regression
        run: node --test test/faceplate-binding.test.cjs
      - name: Faceplate inheritance browser and restart regression
        env:
          TMPDIR: ${{ runner.temp }}
        run: python test/faceplate-e2e.py
      - name: Valve Symbol state and persistence regression
        run: node --test test/valve-symbol.test.cjs
      - name: Valve Symbol browser and editor regression
        env:
          TMPDIR: ${{ runner.temp }}
        run: python test/valve-symbol-e2e.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-instance-browser-evidence
          path: ${{ runner.temp }}/nexfuxa-*.png
          if-no-files-found: ignore
          retention-days: 14

  docker-runtime-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build final runtime image
        run: docker build --build-arg INSTALL_ODBC=false -t nexfuxa-runtime-ci .
      - name: Load PLC Tag Generator from final image
        run: docker run --rm --network none --entrypoint node nexfuxa-runtime-ci -e "const manager = require('./api/plc-device-models/manager'); const generator = require('../tools/plc-device-model/generator.cjs'); if (typeof manager.createManager !== 'function' || typeof generator.generate !== 'function') process.exit(1);"
      - name: Verify isolated Docker restart persistence
        run: node tools/plc-device-model/test/docker-restart.cjs nexfuxa-runtime-ci
