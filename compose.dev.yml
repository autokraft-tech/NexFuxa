name: nexfuxa-valve-dev

services:
  fuxa:
    build:
      context: .
      args:
        INSTALL_ODBC: "false"
    ports:
      - "1882:1881"
    volumes:
      - appdata:/usr/src/app/FUXA/server/_appdata
      - db:/usr/src/app/FUXA/server/_db
      - logs:/usr/src/app/FUXA/server/_logs
      - images:/usr/src/app/FUXA/server/_images
      - ./custom/widgets:/usr/src/app/FUXA/server/_widgets:ro

volumes:
  appdata:
  db:
  logs:
  images:
